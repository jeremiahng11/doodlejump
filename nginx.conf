server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebAssembly must be served with the correct MIME type so the browser
    # can stream-compile it. (Default mime.types covers png/css/js already.)
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
